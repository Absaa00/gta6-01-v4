<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<link rel="icon" href="data:,">
<style>
  /* Solmar Bay — page shell. The game itself is drawn on one canvas. */
  html, body { margin: 0; padding: 0; background: #0a0c14; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #wrap { position: relative; width: min(100vw, 160vh); aspect-ratio: 1280 / 800; }
  canvas { display: block; width: 100%; height: 100%; background: #20242e; cursor: crosshair; }
  #hint {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    color: rgba(255,255,255,0.55); font-size: 12px; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hint">WASD move &amp; drive &nbsp;·&nbsp; E steal car / use shop &nbsp;·&nbsp; Click shoot &nbsp;·&nbsp; Space punch &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</div>
</div>
<script>
  // Capture page errors for the play-test harness; the game never needs this.
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + String(e.reason)));
</script>
<script src="src/util.js"></script>
<script src="src/audio.js"></script>
<script src="src/city.js"></script>
<script src="src/traffic.js"></script>
<script src="src/police.js"></script>
<script src="src/missions.js"></script>
<script src="src/game.js"></script>
</body>
</html>
